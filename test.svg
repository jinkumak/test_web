<svg xmlns="http://www.w3.org/2000/svg"
     width="400"
     height="200"
     viewBox="0 0 400 200">

  <script type="application/ecmascript"><![CDATA[
    function runTest() {
      alert("Hello! SVG JavaScript is running.");
    }
  ]]></script>

  <rect width="400" height="200" fill="white"/>

  <text x="100" y="50" font-size="24">
    SVG JavaScript Test
  </text>

  <rect x="100" y="80"
        width="200" height="60"
        rx="10"
        fill="lightgray"
        onclick="runTest()"/>

  <text x="145" y="118"
        font-size="20"
        onclick="runTest()">
    Click to Run
  </text>

</svg>